name: Deploy Sphinx documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build Japanese documentation
        run: python -m sphinx -b html docs/source/ja docs/build/ja/html

      # - name: Build English documentation
      #   run: python -m sphinx -b html docs/source/en docs/build/en/html

      - name: Create root redirect
        run: |
          cat > docs/build/html/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=ja/">
            <title>Enos's Archive</title>
          </head>
          <body>
            <a href="ja/">日本語</a> |
            <a href="en/">English</a>
          </body>
          </html>
          EOF

      - name: Disable Jekyll
        run: touch docs/build/html/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
