name: Deploy Sphinx documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build Japanese documentation
        run: python -m sphinx -b html docs/source/ja docs/build/ja

      # - name: Build English documentation
      #   run: python -m sphinx -b html docs/source/en docs/build/en

      - name: Assemble GitHub Pages
        run: |
          mkdir -p docs/build/pages/ja
          mkdir -p docs/build/pages/en

          cp -r docs/build/ja/html/. docs/build/pages/ja/
          cp -r docs/build/en/html/. docs/build/pages/en/
          cp docs/source/root/index.html docs/build/pages/index.html

          touch docs/build/pages/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
